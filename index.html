<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche - There is no substitute.</title>
    <link rel="icon" type="image/png" href="images/Porsche.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #D2D2D2;
            background-image:
                repeating-linear-gradient(to right, transparent 0 100px,
                    #25283b22 100px 101px),
                repeating-linear-gradient(to bottom, transparent 0 100px,
                    #25283b22 100px 101px);
        }

        body::before {
            position: absolute;
            width: min(1400px, 90vw);
            top: 10%;
            left: 50%;
            height: 90%;
            transform: translateX(-50%);
            content: '';
            background-image: url(images/bg.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: top center;
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="#" class="home-btn floating-home-btn" id="playAudioBtn">Play</a>
    <audio id="myAudio">
        <source src="audios/clip.webm" type="audio/webm">
    </audio>
    <div class="banner">
        <div class="slider" style="--quantity: 10">
            <div class="item" style="--position: 1">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_1.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 2">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 3">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_3.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 4">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_4.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 5">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_5.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 6">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_6.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 7">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_7.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 8">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_8.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 9">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_9.mp4" type="video/mp4">
                </video>
            </div>
            <div class="item" style="--position: 10">
                <video autoplay muted loop playsinline>
                    <source src="videos/Porsche_10.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        <div class="content">
            <h1 data-content="Porsche">
                Porsche
            </h1>
            <div class="author">
                <h2>911</h2>
                <p><b>GT3 RS</b></p>

            </div>
            <div class="model"></div>
        </div>

        <!-- <div class="navigation">
            <button class="prev">&lt;</button>
            <button class="next">&gt;</button>
        </div> -->
    </div>

    <script src="script.js"></script>
</body>

</html>
